# ==========================================
# 아파트 실거래가 데이터 수집 설정 파일 (setting.yml)
# ==========================================

collection:
  # 1) 초기 전체 수집 시작 년월 (YYYYMM 형식)
  # - DB에 해당 지역 데이터가 아예 없는 경우(최초 수집/신규 지역 추가), 이 시작 년월부터 현재까지 전체 데이터를 수집합니다.
  start_year_month: "202601"

  # 2) 정기 수집 시 롤링 버퍼 개월 수 (30일 신고 의무 유예 기간 반영)
  # - 부동산 실거래가는 계약 후 30일 이내 신고되므로, 이미 데이터가 있는 지역은 당월 외에 직전 N개월을 함께 재조회하여 지연 신고 및 취소/정정 건을 갱신합니다.
  # - 예: recent_months_buffer: 2 이면 당월 포함 최근 3개월치(당월, 전월, 전전월)만 호출하여 API 트래픽을 대폭 절감합니다.
  recent_months_buffer: 2

  # 3) 수집 대상 지역 코드 목록 (LAWD_CD 앞 5자리)
  # - 여러 지역을 추가하여 복수로 수집할 수 있습니다.
  regions:
    - code: "41115"
      name: "수원시 팔달구"
    - code: "41117"
      name: "수원시 영통구"
    # - code: "41111"
    #   name: "수원시 장안구"
    # - code: "41113"
    #   name: "수원시 권선구"

  # 4) 전용면적(타입) 필터링 설정
  # - enabled: true 로 설정 시 types 목록에 정의된 전용면적 구간만 수집/저장합니다.
  # - enabled: false 로 설정 시 모든 전용면적의 데이터를 수집합니다.
  area_filter:
    enabled: true
    types:
      - name: "84타입"
        min: 84.0    # 최소 전용면적(㎡)
        max: 85.0    # 최대 전용면적(㎡, 미만 기준: min <= 면적 < max)
      # - name: "59타입"
      #   min: 59.0
      #   max: 60.0

  # 5) 준공연도(건축년도) 필터 설정
  # - enabled: true 로 설정 시 현시점(KST 기준 연도) 대비 within_years 년 이내 준공된 아파트만 수집합니다.
  # - 예: 2026년 기준 within_years: 10 이면 2016년 이후(2016~현재) 준공 아파트만 수집
  build_year_filter:
    enabled: true
    within_years: 10

  # 6) 특정 관심 아파트 단지 필터
  # - 비워둘 경우([]) 대상 지역의 모든 아파트 단지를 수집합니다.
  # - 특정 단지만 모으고 싶을 경우 리스트에 단지명을 정확히 기재합니다.
  # 예: ["매교역푸르지오SK뷰", "힐스테이트푸르지오수원", "수원센트럴아이파크자이"]
  target_complexes: []

storage:
  # 수집된 SQLite 데이터베이스 파일 경로 및 테이블명
  db_path: "data/transactions.db"
  table_name: "transactions"
