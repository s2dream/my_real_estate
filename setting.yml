# ==========================================
# 아파트 실거래가 데이터 수집 설정 파일 (setting.yml)
# ==========================================

collection:
  # 1) 수집 시작 년월 (YYYYMM 형식)
  # - 지정된 시작 년월부터 한국 시간(KST) 기준 '오늘(현재 월)'까지의 모든 월 데이터를 자동으로 수집합니다.
  start_year_month: "202601"

  # 2) 수집 대상 지역 코드 목록 (LAWD_CD 앞 5자리)
  # - 여러 지역을 추가하여 복수로 수집할 수 있습니다.
  # - 예: 팔달구(41115), 영통구(41117), 장안구(41111), 권선구(41113), 강남구(11680) 등
  regions:
    - code: "41115"
      name: "수원시 팔달구"
    # - code: "41117"
    #   name: "수원시 영통구"
    # - code: "41111"
    #   name: "수원시 장안구"
    # - code: "41113"
    #   name: "수원시 권선구"

  # 3) 전용면적(타입) 필터링 설정
  # - enabled: true 로 설정 시 types 목록에 정의된 전용면적 구간만 수집/저장합니다.
  # - enabled: false 로 설정 시 모든 전용면적의 데이터를 수집합니다.
  area_filter:
    enabled: true
    types:
      - name: "84타입"
        min: 84.0    # 최소 전용면적(㎡)
        max: 85.0    # 최대 전용면적(㎡, 미만 기준: min <= 면적 < max)
      # - name: "59타입"
      #   min: 59.0
      #   max: 60.0

  # 4) 특정 관심 아파트 단지 필터
  # - 비워둘 경우([]) 대상 지역의 모든 아파트 단지를 수집합니다.
  # - 특정 단지만 모으고 싶을 경우 리스트에 단지명을 정확히 기재합니다.
  # 예: ["매교역푸르지오SK뷰", "힐스테이트푸르지오수원", "수원센트럴아이파크자이"]
  target_complexes: []

storage:
  # 수집된 SQLite 데이터베이스 파일 경로 및 테이블명
  db_path: "data/transactions.db"
  table_name: "transactions"
